#
# Build Deploy file for Docker container
# Change the variables in this section to match your project
#

name: Platform Monitor - Deploy

defaults:
  run:
    working-directory: .

on:
  release:
    types: [published]

  pull_request:
    types: [closed]
    branches: ["master", "main", "feature/*"]

  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  staging:
    if: github.event.pull_request.merged == true || github.event.inputs.environment == 'staging' || github.event.inputs.environment == 'production'
    name: Deploy to Staging
    uses: DarkFactorAS/Infrastructure/.github/workflows/infrastructure-deploy-server.yml@v1
    with:
      environment: staging
      project_path: ./PlatformMonitor
      project_name: PlatformMonitor
    secrets: inherit

  production:
    if: github.event.pull_request.merged == true || github.event.inputs.environment == 'production' || github.event_name == 'release'
    name: Deploy to Production
    uses: DarkFactorAS/Infrastructure/.github/workflows/infrastructure-deploy-server.yml@v1
    with:
      environment: production
      project_path: ./PlatformMonitor
      project_name: PlatformMonitor
    secrets: inherit
    needs: staging
